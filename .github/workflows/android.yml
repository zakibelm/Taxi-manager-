name: APK Android

# Compile l'APK Taxi Manager.
# - À chaque push sur main et à la demande : APK téléchargeable dans l'onglet Actions (artefact).
# - Sur une étiquette v* (ex. v1.0.0) : APK joint à une Release GitHub.
# Serveur visé : https://taximanager.partageons.net (capacitor.config.ts), remplaçable par la variable de dépôt TAXIMANAGER_URL.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Lecture seule par défaut : seul le job « release » (étiquettes v*) peut écrire dans le dépôt.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAXIMANAGER_URL: ${{ vars.TAXIMANAGER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version lue dans package.json (packageManager)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Le SDK Android est préinstallé sur ubuntu-latest (ANDROID_HOME) ; Gradle complète les paquets manquants.

      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run build

      - name: Projet Android
        env:
          # Identifiant d'application AdMob (public) ; le bloc de bannière est dans utils/ads.ts.
          ADMOB_APP_ID: ca-app-pub-1054414127660059~2854872316
        run: |
          npx cap add android
          # AdMob : identifiant d'application dans le manifeste (obligatoire, sinon l'app plante au démarrage).
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"@string/admob_app_id\"/>\n    </application>#" android/app/src/main/AndroidManifest.xml
          sed -i "s#</resources>#    <string name=\"admob_app_id\">${ADMOB_APP_ID}</string>\n</resources>#" android/app/src/main/res/values/strings.xml
          grep -q "gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#ffffff' || echo "::warning::Icônes non générées, icône Capacitor par défaut."
          npx cap sync android

      - name: Version de l'APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle

      # Signature : si les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et
      # ANDROID_KEY_PASSWORD sont définis, APK « release » signé avec la clé du projet (mises à jour sans désinstaller).
      # Sinon, APK de débogage comme avant.
      # Avec la clé, un AAB signé (format exigé par le Play Store) est aussi produit, à côté de l'APK.
      - name: Compiler et signer
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="out/TaxiManager-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            (cd android && ./gradlew assembleRelease bundleRelease --no-daemon)
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            export KEY_PASS="${KEY_PASS:-$KS_PASS}"   # même mot de passe pour la clé si non précisé
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$OUT"
            # AAB pour le Play Store : signé avec la clé d'importation (Google re-signe via la signature d'applications Play).
            AAB="out/TaxiManager-${VERSION}-${GITHUB_RUN_NUMBER}.aab"
            cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
            jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env KS_PASS -keypass:env KEY_PASS \
              -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
            jarsigner -verify "$AAB" > /dev/null
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::notice::Secrets de signature absents : APK de débogage, pas d'AAB pour le Play Store."
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TaxiManager-apk
          path: out/*

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TaxiManager-apk
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release déjà créée depuis GitHub (bouton « Draft a new release ») : on y joint l'APK ; sinon on la crée.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* --title "Taxi Manager $GITHUB_REF_NAME" --notes "APK Android de Taxi Manager. Installation : autoriser les sources inconnues, puis ouvrir le fichier."
          fi
