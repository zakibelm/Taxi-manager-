name: APK Android

# Compile l'APK Taxi Manager.
# - À chaque push sur main et à la demande : APK téléchargeable dans l'onglet Actions (artefact).
# - Sur une étiquette v* (ex. v1.0.0) : APK joint à une Release GitHub.
# Serveur visé : https://taximanager.partageons.net (capacitor.config.ts), remplaçable par la variable de dépôt TAXIMANAGER_URL.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Lecture seule par défaut : seul le job « release » (étiquettes v*) peut écrire dans le dépôt.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAXIMANAGER_URL: ${{ vars.TAXIMANAGER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Le SDK Android est préinstallé sur ubuntu-latest (ANDROID_HOME) ; Gradle complète les paquets manquants.

      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run build

      - name: Projet Android
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#ffffff' || echo "::warning::Icônes non générées, icône Capacitor par défaut."
          npx cap sync android

      - name: Version de l'APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSION}\"/" android/app/build.gradle

      # Signature : si les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et
      # ANDROID_KEY_PASSWORD sont définis, APK « release » signé avec la clé du projet (mises à jour sans désinstaller).
      # Sinon, APK de débogage comme avant.
      - name: Compiler et signer
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          OUT="out/TaxiManager-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p out
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            (cd android && ./gradlew assembleRelease --no-daemon)
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            export KEY_PASS="${KEY_PASS:-$KS_PASS}"   # même mot de passe pour la clé si non précisé
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASS --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "$OUT"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::notice::Secrets de signature absents : APK de débogage."
            (cd android && ./gradlew assembleDebug --no-daemon)
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TaxiManager-apk
          path: out/*.apk

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TaxiManager-apk
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk --title "Taxi Manager $GITHUB_REF_NAME" --notes "APK Android de Taxi Manager. Installation : autoriser les sources inconnues, puis ouvrir le fichier."
